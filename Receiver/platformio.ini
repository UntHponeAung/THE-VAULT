[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9488_DRIVER=1
  -D TFT_PARALLEL_8_BIT=1
  -D TFT_CS=33
  -D TFT_DC=32
  -D TFT_RST=26
  -D TFT_WR=25
  -D TFT_RD=-1
  -D TFT_D0=4
  -D TFT_D1=5
  -D TFT_D2=13
  -D TFT_D3=14
  -D TFT_D4=18
  -D TFT_D5=19
  -D TFT_D6=22
  -D TFT_D7=23
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D SMOOTH_FONT=1
